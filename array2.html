<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript array methods</h2>
        <h2>join() and pop()</h2>
        <p>The join() method joins array elements into a string and the pop () method removes the last element from and array.</p>
        <p id="myjoin"></p>
        <P id="myfirstpop"></P>
        <p id="mysecondpop"></p>
        <script>
            var fruits= ["banana", "orange", "apple", "mango"];
            document.getElementById("myjoin").innerHTML=fruits.join(" *");
            document.getElementById("myfirstpop").innerHTML=fruits;
            fruits.pop();
            document.getElementById("mysecondpop").innerHTML=fruits;
        </script>
    </body>
</html>
